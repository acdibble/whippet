name: Test

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the tests on a release commit before publishing it.
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Keep in step with release.yml.
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  test:
    # A pushed release commit is tested by the release workflow, so it isn't tested twice.
    if: "inputs.release || github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: release ')"
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate the Xcode project
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate

      # Builds the app as well as the tests, without signing, since the runner has no certificates.
      - name: Build and test
        run: |
          xcodebuild test \
            -project Whippet.xcodeproj \
            -scheme Whippet \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO
