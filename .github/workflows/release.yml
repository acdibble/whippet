name: Release

# A release starts from a pushed commit titled "chore: release X.Y.Z". It's checked, tested, then built, signed and
# published, and publishing creates its vX.Y.Z tag. Every other push to main stops at the check.
#
# A beta starts from running this workflow by hand on any branch (Actions › Release › Run workflow, or `just beta`).
# It's the next minor version with the commit's short hash, such as 1.4.0-beta.d226ff9, with the Unreleased section
# of CHANGELOG.md as its notes, and is published as a prerelease with only its DMG. Betas don't update themselves to
# later betas; they update to the next release through its appcast.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  TEAM_ID: 5G59X57VMZ
  BUNDLE_ID: codes.dibble.whippet
  SIGNING_IDENTITY: Developer ID Application
  PROFILE_NAME: Whippet Developer ID
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
  # Steps that generate the project, handle secrets or sign run with only the system's tools on PATH, so nothing
  # installed in /opt/homebrew/bin or /usr/local/bin can stand in for security, codesign, xcrun or xcodebuild.
  SYSTEM_PATH: /usr/bin:/bin:/usr/sbin:/sbin

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # Empty unless this push is a release, or this run a beta, that passed every check.
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - name: Find a release commit
        id: commit
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "beta=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          subject="${MESSAGE%%$'\n'*}"
          if [[ "$subject" =~ ^chore:\ release\ ([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "Not a release commit."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.commit.outputs.version != '' || steps.commit.outputs.beta == 'true'
        with:
          persist-credentials: false

      # project.yml holds the version, so a release commit's version must match it, CHANGELOG.md must have notes for
      # it, which become the release notes, and it mustn't have been released already. A beta's version follows from
      # project.yml's, and its notes are whatever is under Unreleased.
      - name: Check the version and its release notes
        id: check
        if: steps.commit.outputs.version != '' || steps.commit.outputs.beta == 'true'
        env:
          VERSION: ${{ steps.commit.outputs.version }}
          BETA: ${{ steps.commit.outputs.beta }}
          GH_TOKEN: ${{ github.token }}
        run: |
          project_version="$(awk '/MARKETING_VERSION:/ { print $2 }' project.yml)"
          if [ "$BETA" = true ]; then
            IFS=. read -r major minor _ <<< "$project_version"
            VERSION="$major.$((minor + 1)).0-beta.${GITHUB_SHA::7}"
            echo "This is a beta, $VERSION."
          elif [ "$project_version" != "$VERSION" ]; then
            echo "::error::The commit releases $VERSION, but project.yml has MARKETING_VERSION $project_version."
            exit 1
          fi
          if grep -q SPARKLE_PUBLIC_KEY_PLACEHOLDER project.yml; then
            echo "::error::SUPublicEDKey in project.yml is still a placeholder, so the release couldn't update itself."
            exit 1
          fi
          if grep -q FEEDBACK_PUBLIC_KEY_PLACEHOLDER project.yml; then
            echo "::error::WhippetFeedbackPublicKey in project.yml is still a placeholder, so feedback wouldn't be sealed."
            exit 1
          fi
          if [ "$BETA" != true ]; then
            awk -v heading="## [$VERSION]" 'index($0, heading) == 1 { found = 1; next } found && /^## \[/ { exit } found { print }' \
              CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
            if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
              echo "::error::CHANGELOG.md has no section for $VERSION."
              exit 1
            fi
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --silent 2>/dev/null; then
            echo "::error::v$VERSION is already released."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=${BETA:-false}" >> "$GITHUB_OUTPUT"

  test:
    needs: check
    if: needs.check.outputs.version != ''
    uses: ./.github/workflows/test.yml
    with:
      release: true

  release:
    needs: [check, test]
    if: needs.check.outputs.version != ''
    runs-on: macos-26
    timeout-minutes: 180
    # Creating the tag and the release needs write access, which only this job has.
    permissions:
      contents: write
    # One release at a time; a second release commit waits rather than cancelling the first.
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG: v${{ needs.check.outputs.version }}
      PRERELEASE: ${{ needs.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sparkle offers an update when its build number is higher, so the build number follows the version: a beta's
      # is below its release's and above every earlier release's. A beta then never gets an older release, such as a
      # fix for the version before, and updates to its own release when that's out. Minor and patch versions stay
      # below 100 for this to hold.
      - name: Read the release notes and work out the build number
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          if [ "$PRERELEASE" = true ]; then
            heading="## [Unreleased]"
          else
            heading="## [$VERSION]"
          fi
          awk -v heading="$heading" 'index($0, heading) == 1 { found = 1; next } found && /^## \[/ { exit } found { print }' \
            CHANGELOG.md > "$notes"
          core="${VERSION%%-*}"
          IFS=. read -r major minor patch <<< "$core"
          build=$((major * 1000000 + minor * 10000 + patch * 100))
          if [ "$PRERELEASE" != true ]; then
            build=$((build + 99))
          fi
          echo "BUILD_NUMBER=$build" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES=$notes" >> "$GITHUB_ENV"

      # The generated project is what xcodebuild runs with the Developer ID keychain unlocked, so XcodeGen is a
      # pinned release, checked against its SHA-256 before it runs, rather than whatever Homebrew has.
      - name: Generate the Xcode project
        env:
          PATH: ${{ env.SYSTEM_PATH }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate

      - name: Install the Developer ID certificate in a temporary keychain
        env:
          PATH: ${{ env.SYSTEM_PATH }}
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/developer-id.p12"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Install the Developer ID provisioning profile
        env:
          PATH: ${{ env.SYSTEM_PATH }}
          PROFILE_BASE64: ${{ secrets.DEVELOPER_ID_PROFILE_BASE64 }}
        run: |
          profile="$RUNNER_TEMP/whippet.provisionprofile"
          echo "$PROFILE_BASE64" | base64 --decode > "$profile"
          uuid="$(security cms -D -i "$profile" | plutil -extract UUID raw -o - -)"
          directory="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$directory"
          cp "$profile" "$directory/$uuid.provisionprofile"

      # Signing settings for Release live on the app target in project.yml, since passing a provisioning profile
      # here would also apply it to the Swift packages, which Xcode rejects.
      - name: Archive
        env:
          PATH: ${{ env.SYSTEM_PATH }}
        run: |
          xcodebuild archive \
            -project Whippet.xcodeproj \
            -scheme Whippet \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Whippet.xcarchive" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN"

      - name: Export the signed app
        env:
          PATH: ${{ env.SYSTEM_PATH }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>developer-id</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingCertificate</key><string>$SIGNING_IDENTITY</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Whippet.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Install the notary API key
        env:
          PATH: ${{ env.SYSTEM_PATH }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          echo "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          echo "NOTARY_KEY=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"

      - name: Notarize and staple the app
        env:
          PATH: ${{ env.SYSTEM_PATH }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          app="$RUNNER_TEMP/export/Whippet.app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/Whippet.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Whippet.zip" \
            --key "$NOTARY_KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait
          xcrun stapler staple "$app"

      - name: Build, sign, notarize and staple the DMG
        env:
          PATH: ${{ env.SYSTEM_PATH }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          staging="$RUNNER_TEMP/dmg"
          dmg="$RUNNER_TEMP/Whippet-$VERSION.dmg"
          mkdir -p "$staging"
          cp -R "$RUNNER_TEMP/export/Whippet.app" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "Whippet" -srcfolder "$staging" -format UDZO -fs APFS "$dmg"
          codesign --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN" --timestamp "$dmg"
          xcrun notarytool submit "$dmg" \
            --key "$NOTARY_KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait
          xcrun stapler staple "$dmg"
          echo "DMG=$dmg" >> "$GITHUB_ENV"

      # Sparkle installs an update only when the DMG and the appcast are signed with the private half of the app's
      # SUPublicEDKey. sign_update comes from the pinned Sparkle package, whose binaries Swift Package Manager checks
      # against their checksums.
      - name: Sign the update and write the appcast
        if: env.PRERELEASE != 'true'
        env:
          PATH: ${{ env.SYSTEM_PATH }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          sign_update="$RUNNER_TEMP/packages/artifacts/sparkle/Sparkle/bin/sign_update"
          enclosure_signature="$(echo "$SPARKLE_PRIVATE_KEY" | "$sign_update" --ed-key-file - "$DMG")"
          appcast="$RUNNER_TEMP/appcast.xml"
          cat > "$appcast" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Whippet</title>
              <item>
                <title>Whippet $VERSION</title>
                <pubDate>$(date -u "+%a, %d %b %Y %H:%M:%S +0000")</pubDate>
                <sparkle:version>$BUILD_NUMBER</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>15.0</sparkle:minimumSystemVersion>
                <sparkle:fullReleaseNotesLink>https://github.com/acdibble/whippet/blob/main/CHANGELOG.md</sparkle:fullReleaseNotesLink>
                <description sparkle:format="markdown"><![CDATA[
          $(cat "$RELEASE_NOTES")
          ]]></description>
                <enclosure url="https://github.com/acdibble/whippet/releases/download/$TAG/Whippet-$VERSION.dmg" type="application/octet-stream" $enclosure_signature />
              </item>
            </channel>
          </rss>
          EOF
          echo "$SPARKLE_PRIVATE_KEY" | "$sign_update" --ed-key-file - "$appcast"
          echo "APPCAST=$appcast" >> "$GITHUB_ENV"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # Creates the tag on the commit that was checked and tested. A beta is a prerelease, which never becomes the
        # latest release, so the appcast at releases/latest stays the last release's.
        run: |
          if [ "$PRERELEASE" = true ]; then
            notes="$RUNNER_TEMP/beta-notes.md"
            {
              printf '%s %s\n' \
                "A beta of Whippet ${VERSION%%-*}, built from \`${GITHUB_SHA::7}\` on \`$GITHUB_REF_NAME\`. Install it from the DMG" \
                "below. It won't update itself to later betas, and updates to ${VERSION%%-*} once that's released."
              if grep -q '[^[:space:]]' "$RELEASE_NOTES"; then
                echo
                cat "$RELEASE_NOTES"
              fi
            } > "$notes"
            gh release create "$TAG" "$DMG" --target "$GITHUB_SHA" --title "Whippet $VERSION" --notes-file "$notes" \
              --prerelease --latest=false
          else
            gh release create "$TAG" "$DMG" "$APPCAST" --target "$GITHUB_SHA" --title "Whippet $VERSION" \
              --notes-file "$RELEASE_NOTES" --latest
          fi

      - name: Remove signing material
        if: always()
        env:
          PATH: ${{ env.SYSTEM_PATH }}
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/notary-key.p8"
