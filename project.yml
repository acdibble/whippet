name: Whippet

options:
  bundleIdPrefix: com.acdibble
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0

targets:
  Whippet:
    type: application
    platform: macOS
    sources:
      - Sources/Whippet
    dependencies:
      - package: GRDB
    info:
      path: Resources/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: Whippet
        CFBundleDisplayName: Whippet
        NSHumanReadableCopyright: "© 2026 Dibble Codes"
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
    entitlements:
      path: Resources/Whippet.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.acdibble.whippet]
        com.apple.developer.aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.acdibble.whippet
        PRODUCT_NAME: Whippet
        DEVELOPMENT_TEAM: 5G59X57VMZ
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
