name: Whippet

options:
  bundleIdPrefix: codes.dibble
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  # Pinned to exact commits so a release build can't pick up a new upstream version while the signing keychain is
  # unlocked. Bump these on purpose.
  GRDB:
    url: https://github.com/groue/GRDB.swift
    revision: b83108d10f42680d78f23fe4d4d80fc88dab3212 # 7.11.1
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    revision: 772133d9dbe800fdac0473226822994c5c162c58 # 3.1.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    revision: eef1a539a373c1f1a320624b1130fc5de7b2e100 # 2.10.0
  # Unit conversion. Its package also lists swift-argument-parser, which only its command-line tool uses; that isn't
  # built into Whippet.
  Units:
    url: https://github.com/NeedleInAJayStack/Units
    revision: 28b3150f23ee84763f894c714eff87808e82e94d # 1.2.1

targets:
  Whippet:
    type: application
    platform: macOS
    sources:
      - Sources/Whippet
      # Shown in the Changelog command and What's New.
      - path: CHANGELOG.md
        buildPhase: resources
    dependencies:
      - package: GRDB
      - package: KeyboardShortcuts
      - package: Sparkle
      - package: Units
    scheme:
      testTargets:
        - WhippetTests
    info:
      path: Resources/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: $(PRODUCT_NAME)
        NSHumanReadableCopyright: "© 2026 Dibble Codes"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Sparkle reads the appcast attached to the newest GitHub release, and installs only updates signed with the
        # private half of this key, which is the SPARKLE_PRIVATE_KEY repository secret.
        SUFeedURL: https://github.com/acdibble/whippet/releases/latest/download/appcast.xml
        SUPublicEDKey: fxFcVkqFr2VW2S+wv8Su55gTeYhKo0fDl6OvGh3YG5I=
        SURequireSignedFeed: true
        # Required by Sparkle alongside a signed feed: the update's signature is checked before it's opened.
        SUVerifyUpdateBeforeExtraction: true
        SUEnableAutomaticChecks: true
        NSAppleEventsUsageDescription: Whippet asks Finder to empty the Trash, and System Events to restart, shut down or switch between light and dark appearance.
        # Feedback is sealed to this key; the private half is in the admin's iCloud Keychain (Settings › Developer).
        WhippetFeedbackPublicKey: 5W6U3iN7bTVu2QR5VGOByySsY05wViUPVM4EZnXAMSY=
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Resources/Whippet.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: codes.dibble.whippet
        PRODUCT_NAME: Whippet
        # The version being worked on. The release workflow checks that its tag matches.
        MARKETING_VERSION: 0.12.0
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: 5G59X57VMZ
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        # A separate app, so a development build runs beside the installed release with its own settings, hotkeys,
        # data folder and permissions, and syncs with CloudKit's Development environment.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: codes.dibble.whippet.dev
          PRODUCT_NAME: Whippet Dev
        Release:
          CODE_SIGN_ENTITLEMENTS: Resources/WhippetRelease.entitlements
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
          PROVISIONING_PROFILE_SPECIFIER: Whippet Developer ID

  # Compiles the logic it tests from the app's sources instead of loading the app, which would open the real
  # history database and start iCloud sync.
  WhippetTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/WhippetTests
      - Sources/Whippet/CaffeineDuration.swift
      - Sources/Whippet/Changelog.swift
      - Sources/Whippet/Calculator.swift
      - Sources/Whippet/ClipboardStore.swift
      - Sources/Whippet/FeedbackImage.swift
      - Sources/Whippet/FeedbackKey.swift
      - Sources/Whippet/FuzzyMatch.swift
      - Sources/Whippet/ImageConversion.swift
      - Sources/Whippet/PageImage.swift
      - Sources/Whippet/Quicklink.swift
      - Sources/Whippet/Ranking.swift
      - Sources/Whippet/SystemCommand.swift
      - Sources/Whippet/Thumbnail.swift
      - Sources/Whippet/TimerDuration.swift
      - Sources/Whippet/TimerItem.swift
      - Sources/Whippet/UnitConversion.swift
      - Sources/Whippet/WindowLayout.swift
    dependencies:
      - package: GRDB
      - package: Units
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: codes.dibble.whippet.tests
        DEVELOPMENT_TEAM: 5G59X57VMZ
        CODE_SIGN_STYLE: Automatic
