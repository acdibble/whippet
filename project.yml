name: Whippet

options:
  bundleIdPrefix: codes.dibble
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.1.0

targets:
  Whippet:
    type: application
    platform: macOS
    sources:
      - Sources/Whippet
    dependencies:
      - package: GRDB
      - package: KeyboardShortcuts
    info:
      path: Resources/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: Whippet
        CFBundleDisplayName: Whippet
        NSHumanReadableCopyright: "© 2026 Dibble Codes"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Resources/Whippet.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: codes.dibble.whippet
        PRODUCT_NAME: Whippet
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: 5G59X57VMZ
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: Resources/WhippetRelease.entitlements
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
          PROVISIONING_PROFILE_SPECIFIER: Whippet Developer ID
